name: Update profile theme and Breakout

on:
  issues:
    types:
      - opened
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-theme-and-breakout
  cancel-in-progress: false

jobs:
  update-profile:
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, '[Profile Theme] ')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve requested theme
        id: theme
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python scripts/profile_theme.py resolve --event-name "$EVENT_NAME" --issue-title "$ISSUE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Apply selected theme
        if: github.event_name == 'issues'
        run: python scripts/profile_theme.py apply "${{ steps.theme.outputs.id }}"

      - name: Generate Breakout contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: breakout
          hide_month_labels: true

      - name: Apply selected theme to Breakout
        shell: bash
        run: |
          for theme_file in .github/profile-themes/*.json; do
            theme="$(basename "$theme_file" .json)"
            light="dist/breakout-contribution-graph-${theme}.svg"
            dark="dist/breakout-contribution-graph-${theme}-dark.svg"
            cp dist/breakout-contribution-graph.svg "$light"
            cp dist/breakout-contribution-graph-dark.svg "$dark"
            python scripts/profile_theme.py recolor-breakout --theme-id "$theme" "$light" "$dark"
            python scripts/profile_theme.py verify-breakout --theme-id "$theme" "$light" "$dark"
          done
          rm dist/breakout-contribution-graph.svg dist/breakout-contribution-graph-dark.svg

      - name: Generate profile visits cards
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "https://komarev.com/ghpvc/?username=${{ github.repository_owner }}&abbreviated=true" \
            --output profile-visits-counter.svg
          python scripts/profile_theme.py generate-visits \
            --visits-svg profile-visits-counter.svg \
            --output-dir dist

      - name: Publish Breakout contribution graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: pacman-output
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published themed profile files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: ${{ steps.theme.outputs.id }}
        run: |
          mkdir -p verified-output
          for suffix in "" "-dark"; do
            file="breakout-contribution-graph-${THEME}${suffix}.svg"
            for attempt in {1..5}; do
              if gh api \
                -H "Accept: application/vnd.github.raw+json" \
                "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=pacman-output" \
                > "verified-output/${file}"; then
                break
              fi
              if [[ "$attempt" == "5" ]]; then
                echo "::error::Published file was not available through the GitHub API: ${file}"
                exit 1
              fi
              sleep 2
            done
          done
          python scripts/profile_theme.py verify-breakout --theme-id "$THEME" \
            "verified-output/breakout-contribution-graph-${THEME}.svg" \
            "verified-output/breakout-contribution-graph-${THEME}-dark.svg"

          for suffix in "" "-dark"; do
            file="profile-visits-${THEME}${suffix}.svg"
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=pacman-output" \
              > "verified-output/${file}"
            grep -q "GitHub visits" "verified-output/${file}"
          done

      - name: Commit selected profile theme
        if: github.event_name == 'issues'
        shell: bash
        run: |
          if git diff --quiet -- README.md .github/profile-theme.json .github/profile-theme-control-*.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/profile-theme.json .github/profile-theme-control-*.svg
          git commit -m "chore(profile): switch to ${{ steps.theme.outputs.id }} theme / смена темы профиля на ${{ steps.theme.outputs.id }}"
          git push origin main

      - name: Delete service theme issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_ADMIN_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Repository secret PROFILE_ADMIN_TOKEN is not configured."
            exit 1
          fi
          gh api graphql \
            -f query='mutation($issueId: ID!) { deleteIssue(input: {issueId: $issueId}) { clientMutationId } }' \
            -f issueId="$ISSUE_NODE_ID"
