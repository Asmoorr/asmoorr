name: Generate Breakout contribution graph

on:
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: contribution-graph-publish
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate Breakout contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: breakout
          hide_month_labels: true

      - name: Apply profile color palette
        run: python scripts/profile_theme.py recolor-breakout dist/breakout-contribution-graph.svg dist/breakout-contribution-graph-dark.svg

      - name: Publish contribution graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: pacman-output
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
