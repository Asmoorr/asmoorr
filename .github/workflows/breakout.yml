name: Generate Breakout contribution graph

on:
  schedule:
    - cron: "15 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: contribution-graph-publish
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Breakout contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: breakout
          hide_month_labels: true

      - name: Apply profile color palette
        shell: bash
        run: |
          sed -i \
            -e 's/#ebedf0/#eaf7f4/g' \
            -e 's/#9be9a8/#b8e0d8/g' \
            -e 's/#40c463/#74d3bd/g' \
            -e 's/#30a14e/#1abc9c/g' \
            -e 's/#216e39/#16a085/g' \
            -e 's/#161b22/#151B23/g' \
            -e 's/#0e4429/#164a40/g' \
            -e 's/#006d32/#167f6c/g' \
            -e 's/#26a641/#18a98c/g' \
            -e 's/#39d353/#1abc9c/g' \
            dist/breakout-contribution-graph.svg \
            dist/breakout-contribution-graph-dark.svg

      - name: Publish contribution graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: pacman-output
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
